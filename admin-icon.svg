<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient: Deep Royal Midnight Jade -->
    <radialGradient id="adminBg" cx="40%" cy="32%" r="92%">
      <stop offset="0%" stop-color="#0e4a3f"/>
      <stop offset="60%" stop-color="#06221c"/>
      <stop offset="100%" stop-color="#02100d"/>
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1a8"/>
      <stop offset="35%" stop-color="#e5b839"/>
      <stop offset="70%" stop-color="#b68918"/>
      <stop offset="100%" stop-color="#7a5807"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="50%" stop-color="#e8bd42"/>
      <stop offset="100%" stop-color="#b08514"/>
    </linearGradient>

    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#092f27" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#031511" stop-opacity="0.98"/>
    </linearGradient>

    <filter id="goldGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#d4af37" flood-opacity="0.35"/>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="url(#adminBg)"/>

  <!-- Outer Heavy Gold Border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#goldLinear)" stroke-width="14"/>

  <!-- Inner Delicate Dotted Gold Ring -->
  <rect x="42" y="42" width="428" height="428" rx="90" fill="none" stroke="#e8bd42" stroke-width="3" stroke-dasharray="8 6" opacity="0.75"/>

  <!-- Corner Ornamental Corner Studs -->
  <circle cx="68" cy="68" r="7" fill="url(#goldBright)"/>
  <circle cx="444" cy="68" r="7" fill="url(#goldBright)"/>
  <circle cx="68" cy="444" r="7" fill="url(#goldBright)"/>
  <circle cx="444" cy="444" r="7" fill="url(#goldBright)"/>

  <!-- Top Crown / Royal Emblem (Symbol of Central Admin Authority) -->
  <g filter="url(#goldGlow)">
    <!-- Crown Base -->
    <path d="M216 88 L256 64 L296 88 L290 102 L222 102 Z" fill="url(#goldBright)"/>
    <!-- Crown Peaks -->
    <polygon points="214,88 230,102 206,102" fill="url(#goldBright)"/>
    <polygon points="298,88 282,102 306,102" fill="url(#goldBright)"/>
    <circle cx="214" cy="85" r="5.5" fill="#fff"/>
    <circle cx="256" cy="60" r="7" fill="#fff"/>
    <circle cx="298" cy="85" r="5.5" fill="#fff"/>
    <circle cx="256" cy="84" r="5" fill="#041a15"/>
  </g>

  <!-- Central Heraldic Shield (Protection, Trust, Authority) -->
  <path d="M148 132 C210 118 302 118 364 132 C376 250 338 316 256 366 C174 316 136 250 148 132 Z" 
        fill="url(#shieldFill)" stroke="url(#goldLinear)" stroke-width="8" filter="url(#badgeShadow)"/>

  <!-- Shield Inner Border -->
  <path d="M162 144 C218 134 294 134 350 144 C360 242 328 298 256 344 C184 298 152 242 162 144 Z" 
        fill="none" stroke="#e8bd42" stroke-width="2.5" opacity="0.6"/>

  <!-- Inner Heraldic Symbols: Medicine Mortar & Healing Leaves -->
  <!-- Left Leaf (Mint/Sage Emerald) -->
  <path d="M256 264 C222 230 216 186 228 148 C262 176 272 222 256 264 Z" fill="#2bb673"/>
  <!-- Right Leaf (Bright Herbal Jade) -->
  <path d="M256 264 C290 230 296 186 284 148 C250 176 240 222 256 264 Z" fill="#7ed6a5"/>
  <!-- Central Stem Leaf -->
  <path d="M256 258 C246 226 246 196 256 168 C266 196 266 226 256 258 Z" fill="#1b8547"/>

  <!-- Traditional Medicine Bowl (Porcelain with Gold Filigree) -->
  <path d="M174 278 h164 c0 48 -38 82 -82 82 s-82 -34 -82 -82 z" fill="#f8f7f2" stroke="url(#goldLinear)" stroke-width="7"/>
  <rect x="164" y="264" width="184" height="24" rx="12" fill="url(#goldBright)"/>
  <rect x="230" y="356" width="52" height="16" rx="6" fill="#a8861c"/>

  <!-- Vitality Pulse (ECG) inside the Bowl -->
  <path d="M196 316 h22 l9 -18 13 36 10 -24 7 6 h28" fill="none" stroke="#0a5c52" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Slanted Golden Master Key (Symbol of Administrative Key & Full Access) -->
  <g transform="rotate(32 256 240)" filter="url(#goldGlow)">
    <!-- Key Ring / Bow -->
    <circle cx="340" cy="180" r="24" fill="none" stroke="url(#goldBright)" stroke-width="8"/>
    <circle cx="340" cy="180" r="12" fill="url(#goldBright)"/>
    <circle cx="340" cy="180" r="6" fill="#051f19"/>
    <!-- Key Shaft -->
    <rect x="240" y="176" width="80" height="8" rx="3" fill="url(#goldBright)"/>
    <!-- Key Teeth -->
    <rect x="248" y="184" width="8" height="16" rx="2" fill="url(#goldBright)"/>
    <rect x="264" y="184" width="8" height="11" rx="2" fill="url(#goldBright)"/>
    <rect x="278" y="184" width="8" height="14" rx="2" fill="url(#goldBright)"/>
  </g>

  <!-- Bottom Distinctive Banner Badge: "ADMIN • باشقۇرۇش" -->
  <g filter="url(#badgeShadow)">
    <!-- Banner Plaque -->
    <rect x="76" y="386" width="360" height="72" rx="24" fill="url(#goldBright)" stroke="#fff" stroke-width="4"/>
    <!-- Inner Fine Border -->
    <rect x="82" y="392" width="348" height="60" rx="18" fill="none" stroke="#7a5807" stroke-width="2" opacity="0.6"/>

    <!-- Keyhole Icon on Left of Banner -->
    <circle cx="118" cy="422" r="12" fill="#041814"/>
    <path d="M115 422 l-2 10 h10 l-2 -10 z" fill="#041814"/>

    <!-- Star Icon on Right of Banner -->
    <circle cx="394" cy="422" r="12" fill="#041814"/>
    <polygon points="394,413 397,419 403,420 399,424 400,430 394,427 388,430 389,424 385,420 391,419" fill="url(#goldBright)"/>

    <!-- Prominent Text: ADMIN & باشقۇرۇش -->
    <!-- Latin ADMIN for universal clarity + Uyghur script -->
    <text x="256" y="416" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="4" fill="#041814" text-anchor="middle">★ ADMIN ★</text>
    <text x="256" y="443" font-family="'Microsoft Uighur', 'UKIJEkran', Arial, sans-serif" font-size="27" font-weight="bold" fill="#05251e" text-anchor="middle">باشقۇرۇش مەركىزى</text>
  </g>
</svg>