<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 1. App Base: Radiant Sunny Amber Gold -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="#f59e0b"/>

  <!-- Top Curved Sunny Highlight for 3D Radiance -->
  <path d="M8 128 C8 62 62 8 128 8 L384 8 C450 8 504 62 504 128 L504 220 C420 200 90 200 8 220 Z" fill="#fbbf24" opacity="0.6"/>

  <!-- 2. Crisp Heavy White Frame -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#ffffff" stroke-width="14"/>

  <!-- Inner Amber Dotted Ring -->
  <rect x="42" y="42" width="428" height="428" rx="90" fill="none" stroke="#b45309" stroke-width="3.5" stroke-dasharray="10 8" opacity="0.5"/>

  <!-- Corner Pearl Studs -->
  <circle cx="68" cy="68" r="9" fill="#ffffff"/>
  <circle cx="444" cy="68" r="9" fill="#ffffff"/>
  <circle cx="68" cy="444" r="9" fill="#ffffff"/>
  <circle cx="444" cy="444" r="9" fill="#ffffff"/>

  <!-- 3. Central Heraldic Authority Shield (Emerald & White) -->
  <!-- Soft Drop Shadow -->
  <path d="M128 144 C210 120 302 120 384 144 C398 282 356 360 256 426 C156 360 114 282 128 144 Z" 
        fill="#78350f" opacity="0.25"/>

  <!-- Main Shield Body: Deep Emerald Jade -->
  <path d="M128 136 C210 112 302 112 384 136 C398 274 356 352 256 418 C156 352 114 274 128 136 Z" 
        fill="#064e3b" stroke="#ffffff" stroke-width="14"/>

  <!-- Inner Gold Shield Inset -->
  <path d="M144 150 C214 130 298 130 368 150 C380 264 346 336 256 396 C166 336 132 264 144 150 Z" 
        fill="#047857" stroke="#fbbf24" stroke-width="4"/>

  <!-- 4. Royal Golden Crown Atop Shield -->
  <!-- Crown Body (Solid 3 Peaks) -->
  <path d="M212 124 L224 88 L244 108 L256 74 L268 108 L288 88 L300 124 Z" 
        fill="#fbbf24" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
  <!-- Crown Base Band -->
  <rect x="208" y="120" width="96" height="12" rx="4" fill="#f59e0b" stroke="#ffffff" stroke-width="3"/>
  <circle cx="232" cy="126" r="3" fill="#ffffff"/>
  <circle cx="256" cy="126" r="3" fill="#ffffff"/>
  <circle cx="280" cy="126" r="3" fill="#ffffff"/>
  <!-- Crown Jewels (White Pearls at Peaks) -->
  <circle cx="224" cy="84" r="6" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="256" cy="70" r="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="288" cy="84" r="6" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>

  <!-- 5. Healing Herbal Leaves -->
  <!-- Left Leaf: Vibrant Spring Mint -->
  <path d="M256 264 C220 228 214 182 226 142 C262 172 272 220 256 264 Z" fill="#34d399"/>
  <!-- Right Leaf: Light Herbal Sage -->
  <path d="M256 264 C292 228 298 182 286 142 C250 172 240 220 256 264 Z" fill="#a7f3d0"/>
  <!-- Central Leaf Vein -->
  <path d="M256 258 C246 226 246 196 256 166 C266 196 266 226 256 258 Z" fill="#059669"/>

  <!-- 6. Traditional Healing Bowl (Pure White & Gold) -->
  <path d="M172 276 h168 c0 50 -38 84 -84 84 s-84 -34 -84 -84 z" fill="#ffffff" stroke="#fbbf24" stroke-width="8"/>
  <rect x="160" y="260" width="192" height="24" rx="12" fill="#fbbf24" stroke="#ffffff" stroke-width="2"/>
  <rect x="228" y="356" width="56" height="16" rx="6" fill="#f59e0b"/>

  <!-- Vitality Heartbeat Pulse Line -->
  <path d="M196 316 h22 l9 -20 13 38 11 -26 7 8 h26" fill="none" stroke="#064e3b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 7. Slanted Golden Master Key (Symbol of Full Administrative Access & Power) -->
  <g transform="rotate(34 256 248)">
    <!-- Key Shadow -->
    <circle cx="344" cy="182" r="26" fill="none" stroke="#022c22" stroke-width="12" opacity="0.3"/>
    <!-- Key Ring / Bow -->
    <circle cx="344" cy="180" r="26" fill="none" stroke="#fbbf24" stroke-width="10"/>
    <circle cx="344" cy="180" r="14" fill="#ffffff"/>
    <circle cx="344" cy="180" r="6" fill="#b45309"/>
    <!-- Key Shaft -->
    <rect x="234" y="174" width="90" height="12" rx="5" fill="#fbbf24" stroke="#ffffff" stroke-width="2"/>
    <!-- Key Teeth -->
    <rect x="244" y="184" width="10" height="20" rx="3" fill="#fbbf24" stroke="#ffffff" stroke-width="2"/>
    <rect x="264" y="184" width="10" height="13" rx="3" fill="#fbbf24" stroke="#ffffff" stroke-width="2"/>
    <rect x="282" y="184" width="10" height="17" rx="3" fill="#fbbf24" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>